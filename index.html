    <title>Palpite Liberado</title>

    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '961619428689288');
    fbq('track', 'PageView');

    async function dispararLead() {
      const eventId = 'CompleteRegistration' + Date.now();
      const params = new URLSearchParams(window.location.search);
      const utms = {};
      ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','campaign','fbclid','gclid'].forEach(k => {
        const v = params.get(k);
        if (v) utms[k] = v;
      });
      try { fbq('track', 'CompleteRegistration', utms, { eventID: eventId }); } catch { /* ignore */ }
      try {
        await fetch('https://track-jp-production.up.railway.app/api/lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fbp: document.cookie.match(/_fbp=([^;]+)/)?.[1] || null,
            fbc: document.cookie.match(/_fbc=([^;]+)/)?.[1] || null,
            userAgent: navigator.userAgent,
            eventId: eventId,
            ...utms
          })
        });
      } catch { /* ignore */ }
    }
    </script>

    src="https://www.facebook.com/tr?id=961619428689288&ev=PageView&noscript=1"/></noscript>
